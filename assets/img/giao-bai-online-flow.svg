<text x="894.0" y="135" text-anchor="middle" font-size="13" fill="#475569">gửi email, nhập về app</text>
<text x="500" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Dữ liệu nằm trong Google Sheet và Drive của giáo viên — không qua máy chủ của ExamMark.</text>
</svg>
