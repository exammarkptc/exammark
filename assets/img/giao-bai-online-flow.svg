<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="Quy trình giao bài và chấm thi online: cài Phòng thi một lần, chọn câu hoặc mã đề, giao và mở bài, học sinh làm bài trên trình duyệt, giáo viên chấm, gửi kết quả và nhập về kỳ thi" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1000" height="210" fill="#f8fafc" rx="14"/>
<rect x="29" y="44" width="178" height="120" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="57" cy="44" r="17" fill="#2563eb"/><text x="57" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
<text x="118.0" y="92" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Cài một lần</text>
<text x="118.0" y="116" text-anchor="middle" font-size="13" fill="#475569">menu ExamRoom trong</text>
<text x="118.0" y="135" text-anchor="middle" font-size="13" fill="#475569">Google Sheet của bạn</text>
<line x1="210" y1="104" x2="211" y2="104" stroke="#64748b" stroke-width="2.5"/><polygon points="211,111 222,104 211,97" fill="#64748b"/>
