<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Chia sẻ để rà soát: người chấm gửi gói, người rà soát sửa và gửi lại, người chấm chọn nhận hoặc giữ điểm" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1000" height="250" fill="#f8fafc" rx="14"/>
<rect x="20" y="44" width="200" height="120" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="48" cy="44" r="17" fill="#2563eb"/><text x="48" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
<text x="120.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Người chấm</text>
<text x="120.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">chọn bài cần rà soát</text>
<text x="120.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">📦 Tạo &amp; tải gói</text>
<rect x="270" y="44" width="200" height="120" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="298" cy="44" r="17" fill="#16a34a"/><text x="298" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
<text x="370.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Người rà soát</text>
<text x="370.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">📥 Nhập gói</text>
<text x="370.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">sửa điểm, góp ý từng ý</text>
<rect x="520" y="44" width="200" height="120" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="548" cy="44" r="17" fill="#16a34a"/><text x="548" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
<text x="620.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Gói kết quả</text>
<text x="620.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">“Gửi kết quả rà soát”</text>
<text x="620.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">(tệp JSON gửi lại)</text>
<rect x="770" y="44" width="200" height="120" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="798" cy="44" r="17" fill="#2563eb"/><text x="798" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
<text x="870.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Người chấm</text>
<text x="870.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">xem chênh lệch</text>
<text x="870.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">Nhận hoặc Giữ từng bài</text>
<line x1="223" y1="104" x2="256.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="256.0,111.0 267,104 256.0,97.0" fill="#64748b"/>
<line x1="473" y1="104" x2="506.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="506.0,111.0 517,104 506.0,97.0" fill="#64748b"/>
<line x1="723" y1="104" x2="756.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="756.0,111.0 767,104 756.0,97.0" fill="#64748b"/>
<text x="500" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Gói mặc định chỉ có điểm, bản chép, đề/đáp án/barem — KHÔNG kèm ảnh bài làm (có ô bật).</text>
<text x="500" y="224" text-anchor="middle" font-size="13.5" fill="#475569">Người rà soát không cần cùng license với người gửi; điểm của người chấm không tự bị đổi.</text>
</svg>