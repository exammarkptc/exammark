<line x1="753" y1="99" x2="766.0" y2="99.0" stroke="#2563eb" stroke-width="2.5"/><polygon points="766.0,106.0 777,99 766.0,92.0" fill="#2563eb"/>
<line x1="700" y1="262" x2="791.7" y2="342.7" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/><polygon points="787.1,348.0 800,350 796.4,337.5" fill="#dc2626"/>
