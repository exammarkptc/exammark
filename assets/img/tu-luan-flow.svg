<text x="900.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Duyệt &amp; xuất</text>
<text x="900.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">CSV · Excel · JSON</text>
<text x="900.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">hoặc gửi rà soát</text>
<text x="500" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AI đề xuất — giáo viên quyết định. Điểm tổng luôn do app cộng lại từ điểm từng ý.</text>
