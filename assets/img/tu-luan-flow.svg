<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="Quy trình chấm tự luận: nhập đề và barem, chụp bài, AI chép và chấm, giáo viên xem và sửa, duyệt và xuất" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1000" height="210" fill="#f8fafc" rx="14"/>
