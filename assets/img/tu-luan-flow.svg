<text x="420.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">→ bản chép</text>
<line x1="494" y1="104" x2="495.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="495.0,111.0 506,104 495.0,97.0" fill="#64748b"/>
