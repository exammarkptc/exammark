<text x="260.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Chụp bài làm</text>
<text x="260.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">theo từng thí sinh</text>
<text x="260.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">hoặc nhập hàng loạt</text>
<line x1="334" y1="104" x2="335.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="335.0,111.0 346,104 335.0,97.0" fill="#64748b"/>
<rect x="349" y="44" width="142" height="120" rx="14" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
