<text x="740.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">điểm, ghi chú</text>
<line x1="814" y1="104" x2="815.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="815.0,111.0 826,104 815.0,97.0" fill="#64748b"/>
