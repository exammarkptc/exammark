<text x="580.0" y="92.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">AI chấm</text>
<text x="580.0" y="116.0" text-anchor="middle" font-size="13.5" fill="#475569">từng ý theo barem</text>
<text x="580.0" y="135.0" text-anchor="middle" font-size="13.5" fill="#475569">+ lý do, cờ xem lại</text>
<line x1="654" y1="104" x2="655.0" y2="104.0" stroke="#64748b" stroke-width="2.5"/><polygon points="655.0,111.0 666,104 655.0,97.0" fill="#64748b"/>
<rect x="669" y="44" width="142" height="120" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
